[package]
name = "jademd-core"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Core vault storage, link analysis, petgraph engine and search for Jademd"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
regex = "1.10"
petgraph = { version = "0.6", features = ["serde-1"] }
walkdir = "2.5"
notify = "6.1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
tracing = "0.1"
sha2 = "0.10"
hex = "0.4"
opendal = { version = "0.59", default-features = false, features = ["services-fs", "services-webdav", "services-gdrive"] }

percent-encoding = "2.3"
http = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
futures-util = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1", features = ["fs"] }

[dev-dependencies]
tempfile = "3"
