<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="jade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <rect width="800" height="400" rx="16" fill="url(#bg)" stroke="#27272a" stroke-width="2"/>

  <!-- Logo Badge -->
  <rect x="50" y="40" width="50" height="50" rx="12" fill="url(#jade)"/>
  <text x="75" y="73" fill="#ffffff" font-family="system-ui, sans-serif" font-size="26" font-weight="bold" text-anchor="middle">J</text>

  <text x="115" y="65" fill="#f4f4f5" font-family="system-ui, sans-serif" font-size="22" font-weight="bold">Jademd Engine Architecture</text>
  <text x="115" y="85" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="13">High Performance Local-First &amp; Cloud Markdown Engine</text>

  <!-- Box 1: Rust Core -->
  <rect x="60" y="130" width="200" height="180" rx="12" fill="#202024" stroke="#10b981" stroke-width="1.5"/>
  <rect x="60" y="130" width="200" height="36" rx="12" fill="#10b981" fill-opacity="0.15"/>
  <text x="160" y="154" fill="#34d399" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Rust Native Core</text>
  <text x="80" y="190" fill="#e4e4e7" font-family="monospace" font-size="12">• Tokio &amp; Axum</text>
  <text x="80" y="215" fill="#e4e4e7" font-family="monospace" font-size="12">• Apache OpenDAL</text>
  <text x="80" y="240" fill="#e4e4e7" font-family="monospace" font-size="12">• Petgraph 2D</text>
  <text x="80" y="265" fill="#e4e4e7" font-family="monospace" font-size="12">• Local I/O &lt; 1ms</text>

  <!-- Arrow 1 -->
  <path d="M 270 220 L 320 220" stroke="#52525b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="295" y="210" fill="#71717a" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">IPC / REST</text>

  <!-- Box 2: React Frontend -->
  <rect x="330" y="130" width="200" height="180" rx="12" fill="#202024" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="330" y="130" width="200" height="36" rx="12" fill="#38bdf8" fill-opacity="0.15"/>
  <text x="430" y="154" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">React 19 Frontend</text>
  <text x="350" y="190" fill="#e4e4e7" font-family="monospace" font-size="12">• CodeMirror 6</text>
  <text x="350" y="215" fill="#e4e4e7" font-family="monospace" font-size="12">• Live Preview</text>
  <text x="350" y="240" fill="#e4e4e7" font-family="monospace" font-size="12">• Infinite Canvas</text>
  <text x="350" y="265" fill="#e4e4e7" font-family="monospace" font-size="12">• Tailwind CSS</text>

  <!-- Arrow 2 -->
  <path d="M 540 220 L 590 220" stroke="#52525b" stroke-width="2"/>
  <text x="565" y="210" fill="#71717a" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Sync</text>

  <!-- Box 3: Cloud & Vaults -->
  <rect x="600" y="130" width="150" height="180" rx="12" fill="#202024" stroke="#a78bfa" stroke-width="1.5"/>
  <rect x="600" y="130" width="150" height="36" rx="12" fill="#a78bfa" fill-opacity="0.15"/>
  <text x="675" y="154" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Almacenamiento</text>
  <text x="615" y="190" fill="#e4e4e7" font-family="monospace" font-size="12">• Disco Local</text>
  <text x="615" y="215" fill="#e4e4e7" font-family="monospace" font-size="12">• Nextcloud</text>
  <text x="615" y="240" fill="#e4e4e7" font-family="monospace" font-size="12">• Google Drive</text>
  <text x="615" y="265" fill="#e4e4e7" font-family="monospace" font-size="12">• Red SMB/NFS</text>
</svg>
